# GitHub Pages is not enabled for this repository. This workflow validates the
# public frontend without attempting to publish to a nonexistent Pages site.
# The production hosting/deployment pipeline is managed separately.
name: Validate frontend build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Guard — never publish backend or private packages
        run: |
          if [ -d dist/backend ] || [ -d dist/content-review ] || [ -f dist/content-review.zip ]; then
            echo "Refusing to publish backend or private editorial package"
            exit 1
          fi
          if find dist -name 'main.py' -o -name 'Dockerfile.optimized' | grep -q .; then
            echo "Refusing to package Python backend artifacts"
            exit 1
          fi

      - name: Verify public output exists
        run: test -s dist/index.html
