<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bible Manager workflow fixture</title><style>
:root{color-scheme:light dark;font-family:system-ui}body{margin:0;background:#f6f0e5;color:#241b19}.page{max-width:900px;margin:auto;padding:20px}.tabs,.actions{display:flex;gap:8px;flex-wrap:wrap}button,input,select,textarea{min-height:44px;font:inherit;border:1px solid #8c766c;border-radius:10px;padding:8px;background:#fff;color:#241b19}button{cursor:pointer}.primary{background:#33162a;color:#fff}.card{margin-top:18px;border:1px solid #c7b8aa;border-radius:16px;background:#fff;padding:18px}.row{display:grid;grid-template-columns:70px 1fr;gap:8px;margin:8px 0}.notice{padding:10px;border-radius:10px;background:#e5f2e5}.hidden{display:none}@media(max-width:480px){.row{grid-template-columns:1fr}.page{padding:12px}.actions button{flex:1}}
</style><body><main class="page"><h1>Bible Manager</h1><nav class="tabs"><button id="chapters">Chapters</button><button id="imports">Bulk Import</button></nav><section id="editor" class="card"><label>Translation <select><option>Liturgical Geʽez</option><option>Amharic</option><option>English</option></select></label><div class="row"><input aria-label="Verse number" value="1"><textarea aria-label="Verse text">በቀዳሚ ገብረ እግዚአብሔር።</textarea></div><div class="actions"><button id="save">Save Draft</button><button id="publish" class="primary">Publish</button><button id="restore">Restore to Draft</button></div><p id="status" class="notice hidden"></p></section><section id="import" class="card hidden"><h2>Bulk import</h2><label>Conflict behavior <select id="mode"><option value="create">Create only — skip existing chapters</option><option value="update">Update existing — replace the chapter draft</option></select></label><button id="preview">Preview import</button><div id="previewResult" class="hidden"><p>1 chapter · 2 verses</p><p>Possible missing verse between 1 and 3.</p><button id="stage" class="primary">Stage Import as Drafts</button></div></section></main><script>
const status=document.querySelector('#status');const show=(text)=>{status.textContent=text;status.classList.remove('hidden')};document.querySelector('#save').onclick=()=>show('Draft saved. Public Scripture was not changed.');document.querySelector('#publish').onclick=()=>show('Chapter published. The public reader now uses this revision.');document.querySelector('#restore').onclick=()=>show('Revision restored as a draft.');document.querySelector('#imports').onclick=()=>{document.querySelector('#editor').classList.add('hidden');document.querySelector('#import').classList.remove('hidden')};document.querySelector('#chapters').onclick=()=>{document.querySelector('#import').classList.add('hidden');document.querySelector('#editor').classList.remove('hidden')};document.querySelector('#preview').onclick=()=>document.querySelector('#previewResult').classList.remove('hidden');document.querySelector('#stage').onclick=()=>show('Import staged as drafts. Nothing was published.');
</script></body></html>
